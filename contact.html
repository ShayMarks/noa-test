<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | FRAMELESS LAB</title>
<meta name="description" content="Start a custom project brief with FRAMELESS LAB. AI-generated campaign imagery delivered in 5 to 7 business days.">
<meta property="og:title" content="Contact | FRAMELESS LAB">
<meta property="og:description" content="Start a custom project brief with FRAMELESS LAB. AI-generated campaign imagery delivered in 5 to 7 business days.">
<meta property="og:image" content="images/hero.jpg">
<meta name="theme-color" content="#595148">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="">
<script src="js/site.js"></script>
<main>
<section class="page-top wrap" style="padding-bottom:var(--section)">
  <div class="contact__banner"><img class="cover" src="images/contact-a.jpg" alt="A laptop, material swatches and notebooks on a pale desk" width="2400" height="1350"></div>
  <div class="split contact__grid">
    <div class="contact__intro">
      <h1 class="serif">Start a custom project brief with us</h1>
      <p>AI-generated campaign imagery delivered in 5 to 7 business days.</p>
      <p>Remote collaboration across all time zones. Calls follow your time zone, and assets travel by shared folder.</p>
    </div>
    <form class="form">
      <div><label for="f-first">First Name *</label><input id="f-first" name="First Name" type="text" autocomplete="given-name" required></div>
      <div><label for="f-last">Last Name *</label><input id="f-last" name="Last Name" type="text" autocomplete="family-name" required></div>
      <div class="full"><label for="f-email">Email *</label><input id="f-email" name="Email" type="email" autocomplete="email" required></div>
      <div class="full"><label for="f-brand">Brand</label><input id="f-brand" name="Brand" type="text" autocomplete="organization"></div>
      <div class="full"><label for="f-cat">Category</label>
        <select id="f-cat" name="Category"><option value=""></option><option>Fashion and swimwear</option><option>Beauty and skincare</option><option>Jewelry</option><option>Food and beverage</option><option>Hospitality</option><option>Lifestyle and custom production</option></select></div>
      <fieldset class="full"><legend>Package</legend>
        <label class="check"><input type="checkbox" name="Package" value="Starter">Starter</label>
        <label class="check"><input type="checkbox" name="Package" value="Campaign">Campaign</label>
        <label class="check" style="margin-bottom:0!important"><input type="checkbox" name="Package" value="Custom scope">Custom scope</label>
      </fieldset>
      <div class="full"><label for="f-date">Deadline</label><input id="f-date" name="Deadline" type="date"></div>
      <div class="full"><label for="f-msg">Message</label><textarea id="f-msg" name="Message" placeholder="Tell us more about your project..."></textarea></div>
      <button class="full" type="submit">Submit</button>
      <p class="full form__status" role="status"></p>
    </form>
  </div>
</section>

</main>
</body>
</html>
